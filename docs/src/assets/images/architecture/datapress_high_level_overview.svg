<desc style="fill:rgb(0, 0, 0);stroke:none;color:rgb(11, 11, 11);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, &quot;system-ui&quot;, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto">Three client types (HTTP, Quack, PostgreSQL) connect into a single DataPress process containing listeners, auth, a query engine, and one resident dataset in RAM. Management commands and Parquet/Delta storage feed in from below.</desc>
