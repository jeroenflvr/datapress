<svg width="680" viewBox="0 0 680 560" role="img" xmlns="http://www.w3.org/2000/svg">
<title>Basic DataPress deployment on AWS</title>
<style>
.cg rect{fill:#f4f4f6;stroke:#c9ccd3;stroke-width:1}
.cp rect{fill:#f6f2fd;stroke:#c9b6f2;stroke-width:1}
.ct rect{fill:#e7f6f3;stroke:#7fd0c3;stroke-width:1}
.th{font:600 13px -apple-system,'Segoe UI',system-ui,sans-serif;fill:#1f2937}
.ts{font:11.5px -apple-system,'Segoe UI',system-ui,sans-serif;fill:#64748b}
.arr{stroke:#94a3b8;stroke-width:1.2;fill:none}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>

<g class="cg">
  <rect x="240" y="40" width="200" height="56" rx="8"/>
  <text class="th" x="340" y="58" text-anchor="middle" dominant-baseline="central">Clients</text>
  <text class="ts" x="340" y="78" text-anchor="middle" dominant-baseline="central">HTTP · Arrow IPC · SQL</text>
</g>

<line x1="340" y1="96" x2="340" y2="196" class="arr" marker-end="url(#a)"/>

<g class="cg">
  <rect x="65" y="150" width="550" height="370" rx="20"/>
  <text class="th" x="90" y="174" dominant-baseline="central">AWS</text>
</g>

<g class="ct">
  <rect x="225" y="200" width="230" height="56" rx="8"/>
  <text class="th" x="340" y="218" text-anchor="middle" dominant-baseline="central">Application Load Balancer</text>
  <text class="ts" x="340" y="238" text-anchor="middle" dominant-baseline="central">TLS · /readyz health checks</text>
</g>

<line x1="340" y1="256" x2="340" y2="288" class="arr" marker-end="url(#a)"/>

<g class="cp">
  <rect x="140" y="290" width="400" height="120" rx="14"/>
  <text class="th" x="340" y="312" text-anchor="middle" dominant-baseline="central">ECS Fargate task</text>
</g>
<g class="ct">
  <rect x="190" y="336" width="300" height="56" rx="8"/>
  <text class="th" x="340" y="354" text-anchor="middle" dominant-baseline="central">DataPress</text>
  <text class="ts" x="340" y="374" text-anchor="middle" dominant-baseline="central">one process · DuckDB backend</text>
</g>

<line x1="340" y1="442" x2="340" y2="412" class="arr" marker-end="url(#a)"/>

<g class="cg">
  <rect x="240" y="444" width="200" height="56" rx="8"/>
  <text class="th" x="340" y="462" text-anchor="middle" dominant-baseline="central">S3 bucket</text>
  <text class="ts" x="340" y="482" text-anchor="middle" dominant-baseline="central">Parquet · Delta</text>
</g>
</svg>
