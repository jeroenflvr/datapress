[package]
name             = "datapress-duckdb"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
description = "DuckDB-backed implementation of the datapress Parquet/Delta dataset HTTP server."
documentation = "https://docs.datap-rs.org"
readme = "README.md"

[features]
default = []
docs    = ["datapress-core/docs"]
swagger = ["datapress-core/swagger"]
metrics = ["datapress-core/metrics"]
auth    = ["datapress-core/auth"]
explorer = ["datapress-core/explorer"]
mcp     = ["datapress-core/mcp"]

[dependencies]
datapress-core = { workspace = true, features = ["duckdb"] }

actix-web.workspace   = true
async-trait.workspace = true
bytes.workspace       = true
futures-util.workspace = true
tokio.workspace       = true
serde.workspace       = true
serde_json.workspace  = true
log.workspace         = true
env_logger.workspace  = true

duckdb.workspace = true
arrow.workspace  = true
tempfile = "3"
object_store = { workspace = true }

[dev-dependencies]
tempfile = "3"
parquet = { workspace = true }
arrow = { workspace = true }

[[bin]]
name = "datapress-duckdb"
path = "src/bin/datapress-duckdb.rs"
