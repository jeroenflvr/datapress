[package]
name             = "datapress-datafusion"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
description = "Apache Arrow + DataFusion-backed implementation of the datapress Parquet/Delta dataset HTTP server."
documentation = "https://docs.datap-rs.org"
readme = "README.md"

[features]
default = []
docs    = ["datapress-core/docs"]
swagger = ["datapress-core/swagger"]
metrics = ["datapress-core/metrics"]
auth    = ["datapress-core/auth"]
explorer = ["datapress-core/explorer"]
mcp     = ["datapress-core/mcp"]
# PostgreSQL wire-protocol server. Off by default; pulls in datafusion-postgres
# (which re-exports pgwire) only when explicitly enabled.
pgwire  = ["dep:datafusion-postgres"]

[dependencies]
datapress-core = { workspace = true, features = ["datafusion"] }

actix-web.workspace   = true
async-trait.workspace = true
bytes.workspace       = true
futures-util.workspace = true
tokio.workspace       = true
serde.workspace       = true
serde_json.workspace  = true
log.workspace         = true
env_logger.workspace  = true

arrow.workspace        = true
parquet.workspace      = true
datafusion.workspace   = true
rayon.workspace        = true
itoa.workspace         = true
ryu.workspace          = true
ahash.workspace        = true
arc-swap.workspace     = true
object_store.workspace = true
url.workspace          = true
deltalake.workspace    = true

# pgwire feature only.
datafusion-postgres = { workspace = true, optional = true }

[dev-dependencies]
tempfile = "3"
criterion = { version = "0.8", features = ["html_reports"] }
# pgwire e2e tests (gated at runtime by #![cfg(feature = "pgwire")]).
tokio-postgres = "0.7"
tokio-postgres-rustls = "0.14"
rustls = { version = "0.23", default-features = false, features = ["ring"] }
rcgen = "0.14"
toml.workspace = true
# Used by the metrics deviation-closure tests (#[cfg(feature = "metrics")]).
prometheus = { workspace = true }

[[bin]]
name = "datapress-datafusion"
path = "src/bin/datapress-datafusion.rs"

[[bench]]
name = "serialize"
harness = false

[[bench]]
name = "index"
harness = false
