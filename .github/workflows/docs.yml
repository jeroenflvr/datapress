name: Docs

on:
  push:
    branches: [main]
    paths:
      - docs/**
      - .github/workflows/docs.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: build-mkdocs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
      - name: Build MkDocs site
        run: uv tool run --with 'mkdocs>=1.6,<2' --with 'mkdocs-material>=9.6,<10' mkdocs build -f docs/mkdocs.yml -d site --strict
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v4
        with:
          path: docs/site

  deploy:
    name: deploy-github-pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  verify:
    name: verify-deployed-version
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      # Assert the freshly deployed site actually serves the version badge
      # from mkdocs.yml, catching stale-cache / failed-propagation deploys.
      - name: Assert deployed version badge
        run: |
          version="$(grep -E 'datapress_version:' docs/mkdocs.yml \
            | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -1)"
          if [ -z "$version" ]; then
            echo "could not read datapress_version from docs/mkdocs.yml" >&2
            exit 1
          fi
          echo "Expecting deployed badge v$version"
          for attempt in 1 2 3 4 5 6; do
            html="$(curl -fsSL https://docs.datap-rs.org/ || true)"
            if printf '%s' "$html" | grep -qF "v$version"; then
              echo "Deployed site serves v$version"
              exit 0
            fi
            echo "attempt $attempt: v$version not visible yet, retrying..."
            sleep 15
          done
          echo "deployed site never served v$version" >&2
          exit 1